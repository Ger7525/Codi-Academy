<!DOCTYPE html>
<html lang="pt-br">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <link rel="stylesheet" href="style.css">
                    <link rel="shortcut icon" href="../Landing page da Netflix/Netflix/imagens/net.ico" type="image/x-icon">
                    <title>NetFlix | Exercício</title>
</head>
<body>
    <header>
        <div class="logo-left">
            <img src="img/netflix-logo.png" alt="logo" width="150px" height="80px
            ">
        </div>
        <div class="logo-rigth">
            <select name="idioma" id="idioma">
                <option value="pt-br">Português</option>
                <option value="en">Inglês</option>
            </select>
            <button><a href="#">Entrar</a></button>
        </div>
    </header>
    <main>
        <section class="title-main">
            <h1>Filmes, séries e muito mais. Sem Limites.</h1>
            <h2>Assista onde quiser. Cancele quando quiser.</h2>
            <p>Pronto para assistir? Informe seu email para criar sua conta.</p>
        </section>
        <section class="email-main">
            <input type="email" name="email" id="email" placeholder="Email">
            <button><a href="#">Vamos lá</a></button>
        </section>
    </main>
        
          
                    
</body>
</html>
