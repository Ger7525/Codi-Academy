<!DOCTYPE html>
<html lang="pt-br">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <link rel="shortcut icon" href="img/net.ico" type="image/x-icon">
                    <link rel="stylesheet" href="style.css">
                    <title>Exe001 | Netflix</title>
</head>
<body>
       <header>
           <nav>
              <div class="left">
                 <img src="img/netflix-logo.png" alt="logo" width="150px" height="80px">   
              </div> 
              <div class="rigth">
                 <select name="linguagem" id="linguagem">
                    <option value="pt-br">Português</option>
                    <option value="en">English</option>
                 </select>
                 <button><a href="#">Entrar</a></button>   
              </div>     
           </nav>         
       </header> 
       <main>
           <section class="desc">
                <h1>Filmes, Series e muito mais. Sem limites.</h1>
                <h2>Assista onde quiser. Cancele quando quiser.</h2>
                <article class="email">
                    <p>Pronto para assistir? Informe seu email para criar sua assinatura.</p>
                    <form action="#">
                       <input type="email" placeholder="Email" id="email">
                       <button><a href="#">Vamos lá</a></button>                 
                    </form>
                </article>    
           </section>         
       </main>
       <footer>
           <p>&copy; 2023 Netflix. Todos os direitos reservados.</p>
           <p>Exercicio feito por Germano Santos com orientação da Codi Academy.</p>
       </footer>            
                    
</body>
</html>
